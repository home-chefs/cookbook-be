on:
  push:
    tags:
      - 'v*'
name: Build and Publish Docker Image
jobs:
  build-docker:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
      with:
        driver-opts: "image=moby/buildkit:v0.10.5"
    - name: Define docker image meta data tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: homechefs/cookbook-be
        tags: |

          # Tag "latest" on git-tag events
          type=raw,value=latest,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

          # Tag "tag ref" on git-tag events
          type=ref,event=tag
    - name: Login to Dockerhub container registry
      uses: docker/login-action@v3
      with:
        username: homechefscookbook
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}